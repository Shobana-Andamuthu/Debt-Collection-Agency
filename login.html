<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aegis Recovery Partners — Secure Client Recovery Portal Login.">
  <title>Client Portal Login | Aegis Recovery Partners</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-body);">

  <!-- PAGE PRELOADER -->
  <div id="pagePreloader" style="position: fixed; inset: 0; z-index: 999999; background-color: #0A192F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;">
    <div class="preloader-spinner-ring"></div>
    <div class="preloader-brand-box">
      <div class="preloader-text-brand">AEGIS <span class="gold-accent">RECOVERY</span></div>
    </div>
    <div class="preloader-bar-track"><div class="preloader-bar-fill"></div></div>
  </div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div style="background: var(--bg-surface); max-width: 960px; width: 100%; border-radius: var(--radius-2xl); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); overflow: hidden;" class="visual-split-row">
      <!-- Left Visual Hero Panel -->
      <div class="visual-media-frame" style="border-radius: 0; height: 100%; min-height: 480px; position: relative;">
        <img src="assets/images/sections/login-vault-bg.jpg" alt="Aegis 256-Bit Vault Security Interface" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="visual-hero-overlay" style="background: linear-gradient(180deg, rgba(15,23,42,0.4) 0%, rgba(15,23,42,0.92) 100%);"></div>
        
        <!-- Brand Emblem inside Card -->
        <a href="index.html" class="nav-brand" style="position: absolute; top: 24px; left: 24px; z-index: 10;">
          <div class="brand-emblem"><img src="assets/images/icons/logo.svg" alt="Aegis Logo" width="28" height="28"></div>
          <div class="brand-text"><span class="brand-title" style="color: #FFFFFF !important;">AEGIS <span class="gold-accent">RECOVERY</span></span></div>
        </a>

        <div class="floating-metric-badge" style="bottom: 30px; left: 24px; right: 24px;">
          <div class="floating-badge-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
          <div>
            <div class="floating-badge-value">SOC 2 Type II Encrypted</div>
            <div class="floating-badge-label">Real-time Claims Telemetry</div>
          </div>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div style="padding: 2.5rem 2.25rem; display: flex; flex-direction: column; justify-content: center; position: relative;">
        <!-- Top Actions -->
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1.25rem;">
          <button type="button" class="icon-btn theme-toggle-btn" aria-label="Toggle theme"><span class="theme-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span></button>
          <button type="button" class="icon-btn rtl-toggle-btn" aria-label="Toggle direction"><span class="dir-label" style="font-size: 0.75rem; font-weight: 700;">RTL</span></button>
          <a href="index.html" class="btn btn-outline-gold btn-sm" style="font-size: 0.78rem; padding: 0.4rem 0.85rem;">Home</a>
        </div>

        <div style="margin-bottom: 1.75rem;">
          <span class="section-tag">Secure Client Portal</span>
          <h2 style="font-size: 1.75rem; margin-top: 0.5rem; margin-bottom: 0.35rem; color: var(--text-main);">Sign In to Aegis Recovery</h2>
          <p style="font-size: 0.875rem; color: var(--text-muted); margin: 0;">Access live case telemetry, recoveries, and legal documents.</p>
        </div>

        <form action="dashboard.html" method="get">
          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);" for="clientEmail">Client Corporate Email</label>
            <input type="email" id="clientEmail" required placeholder="corporate.officer@company.com" value="admin@aegisrecovery.com" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
          </div>
          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);" for="clientPassword">Portal Password</label>
            <input type="password" id="clientPassword" required placeholder="••••••••••••" value="password123" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
          </div>
          <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">Access Client Portal</button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          Need an enterprise client account? <a href="register.html" style="color: var(--color-accent); font-weight: 700;">Request Onboarding</a>
        </div>
      </div>
    </div>
  </main>
  <!-- Floating Back to Top Button -->
  <button type="button" class="back-to-top-btn" id="backToTopBtn" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
  <script src="assets/js/main.js?v=303"></script>
</body>
</html>
